services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: todo_app_dev
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_app_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: